<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맛집노트 - 주변 식당 평가 앱</title>
  <meta name="description" content="가보고 싶은 맛집을 등록하고, 방문 여부·별점·메모로 관리하는 웹 애플리케이션">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-dark">
  <div class="app-background-glow"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
            <path d="M7 2v20"></path>
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">맛집노트</h1>
          <p class="brand-subtitle" id="current-date">주변 식당 평가 앱</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" title="다크/라이트 테마 변경">
          <svg id="theme-icon-sun" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Section -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">등록한 맛집</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-badge blue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">방문 완료</span>
          <span class="stat-value" id="stat-visited">0</span>
        </div>
        <div class="stat-badge emerald">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">평균 별점</span>
          <span class="stat-value" id="stat-avg-rating">-</span>
        </div>
        <div class="stat-badge amber">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" fill-opacity="0">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
      </div>

      <div class="stat-card progress-card">
        <div class="stat-info">
          <span class="stat-label">방문률</span>
          <span class="stat-value" id="stat-rate">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Add Restaurant Form -->
    <section class="card form-card">
      <form id="place-form" class="todo-form">
        <div class="form-main-row">
          <input
            type="text"
            id="place-name"
            class="input-title"
            placeholder="식당 이름을 입력하세요 (예: 을지로 골목집)"
            required
            autocomplete="off"
          />
          <button type="submit" class="btn-primary" id="btn-add-place">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>추가하기</span>
          </button>
        </div>

        <div class="form-sub-row">
          <div class="form-field">
            <label for="place-category">카테고리</label>
            <select id="place-category" class="input-select">
              <option value="한식">🍚 한식</option>
              <option value="중식">🥟 중식</option>
              <option value="일식">🍣 일식</option>
              <option value="양식">🍝 양식</option>
              <option value="카페·디저트">☕ 카페·디저트</option>
              <option value="술집">🍺 술집</option>
              <option value="기타">✨ 기타</option>
            </select>
          </div>

          <div class="form-field">
            <label for="place-location">지역 / 위치 (선택)</label>
            <input type="text" id="place-location" class="input-text" placeholder="예: 강남역 근처" />
          </div>

          <div class="form-field desc-field">
            <label for="place-memo">메모 (선택)</label>
            <input type="text" id="place-memo" class="input-text" placeholder="가고 싶은 이유 또는 방문 후기..." />
          </div>
        </div>

        <div class="form-sub-row visit-row">
          <label class="visit-switch">
            <input type="checkbox" id="place-visited" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">이미 방문했어요</span>
          </label>

          <div class="form-field rating-field hidden" id="rating-field">
            <label>별점</label>
            <div class="star-picker" id="rating-picker" data-value="0">
              <span class="star" data-value="1">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="5">★</span>
            </div>
          </div>
        </div>
      </form>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="toolbar">
      <div class="filter-tabs" id="status-tabs">
        <button class="tab-btn active" data-status="all">전체</button>
        <button class="tab-btn" data-status="wishlist">가보고 싶은 곳</button>
        <button class="tab-btn" data-status="visited">방문 완료</button>
      </div>

      <div class="toolbar-controls">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="이름·지역 검색..." />
        </div>

        <select id="filter-category" class="filter-select">
          <option value="all">모든 카테고리</option>
          <option value="한식">한식</option>
          <option value="중식">중식</option>
          <option value="일식">일식</option>
          <option value="양식">양식</option>
          <option value="카페·디저트">카페·디저트</option>
          <option value="술집">술집</option>
          <option value="기타">기타</option>
        </select>

        <select id="sort-select" class="filter-select">
          <option value="recent">최신순</option>
          <option value="rating-desc">별점 높은순</option>
          <option value="name">이름순</option>
        </select>

        <button id="btn-clear-all" class="btn-secondary" title="전체 목록 삭제">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>전체 삭제</span>
        </button>
      </div>
    </section>

    <!-- Place List Container -->
    <main class="todo-list-container">
      <div id="place-list" class="todo-list">
        <!-- JS로 동적 렌더링 -->
      </div>

      <!-- Empty State Placeholder -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <p class="empty-title">등록된 맛집이 없습니다</p>
        <p class="empty-subtitle">가보고 싶은 식당을 추가하고 방문 기록을 남겨보세요!</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Python Flask 기반 주변 식당 평가 앱 · 데이터는 이 브라우저에만 저장됩니다</p>
    </footer>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">맛집 정보 편집</h2>
        <button id="modal-close" class="btn-icon" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="edit-form" class="modal-body">
        <input type="hidden" id="edit-id" />

        <div class="modal-field">
          <label for="edit-name">이름</label>
          <input type="text" id="edit-name" class="input-title" required />
        </div>

        <div class="modal-row">
          <div class="modal-field">
            <label for="edit-category">카테고리</label>
            <select id="edit-category" class="input-select">
              <option value="한식">🍚 한식</option>
              <option value="중식">🥟 중식</option>
              <option value="일식">🍣 일식</option>
              <option value="양식">🍝 양식</option>
              <option value="카페·디저트">☕ 카페·디저트</option>
              <option value="술집">🍺 술집</option>
              <option value="기타">✨ 기타</option>
            </select>
          </div>

          <div class="modal-field">
            <label for="edit-location">지역 / 위치</label>
            <input type="text" id="edit-location" class="input-date" />
          </div>
        </div>

        <label class="visit-switch">
          <input type="checkbox" id="edit-visited" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">방문 완료</span>
        </label>

        <div class="modal-field rating-field hidden" id="edit-rating-field">
          <label>별점</label>
          <div class="star-picker" id="edit-rating-picker" data-value="0">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
        </div>

        <div class="modal-field">
          <label for="edit-memo">메모</label>
          <textarea id="edit-memo" class="input-textarea" rows="3" placeholder="메모를 입력하세요..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-edit" class="btn-secondary">취소</button>
          <button type="submit" class="btn-primary">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
