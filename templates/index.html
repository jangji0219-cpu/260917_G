<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - 스마트 할 일 관리 웹앱</title>
  <meta name="description" content="Flask 기반의 직관적이고 세련된 스마트 할 일 관리 웹 애플리케이션">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-dark">
  <div class="app-background-glow"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">TaskFlow</h1>
          <p class="brand-subtitle" id="current-date">스마트 할 일 관리 대시보드</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" title="다크/라이트 테마 변경">
          <svg id="theme-icon-sun" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Section -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">전체 할 일</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-badge blue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">진행 중</span>
          <span class="stat-value" id="stat-active">0</span>
        </div>
        <div class="stat-badge amber">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">완료됨</span>
          <span class="stat-value" id="stat-completed">0</span>
        </div>
        <div class="stat-badge emerald">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
      </div>

      <div class="stat-card progress-card">
        <div class="stat-info">
          <span class="stat-label">달성률</span>
          <span class="stat-value" id="stat-rate">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Create Todo Form -->
    <section class="card form-card">
      <form id="todo-form" class="todo-form">
        <div class="form-main-row">
          <input 
            type="text" 
            id="todo-title" 
            class="input-title" 
            placeholder="어떤 일을 완료해야 하나요? (예: 파이썬 웹앱 완성하기)" 
            required 
            autocomplete="off"
          />
          <button type="submit" class="btn-primary" id="btn-add-todo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>추가하기</span>
          </button>
        </div>

        <div class="form-sub-row">
          <div class="form-field">
            <label for="todo-category">카테고리</label>
            <select id="todo-category" class="input-select">
              <option value="업무">💼 업무</option>
              <option value="개발">💻 개발</option>
              <option value="개인">👤 개인</option>
              <option value="공부">📚 공부</option>
              <option value="건강">🏃 건강</option>
              <option value="기타">✨ 기타</option>
            </select>
          </div>

          <div class="form-field">
            <label for="todo-priority">우선순위</label>
            <select id="todo-priority" class="input-select">
              <option value="high">🔥 높음</option>
              <option value="medium" selected>⚡ 보통</option>
              <option value="low">🌱 낮음</option>
            </select>
          </div>

          <div class="form-field">
            <label for="todo-due-date">마감일</label>
            <input type="date" id="todo-due-date" class="input-date" />
          </div>

          <div class="form-field desc-field">
            <label for="todo-desc">상세 메모 (선택)</label>
            <input type="text" id="todo-desc" class="input-text" placeholder="간단한 메모 입력..." />
          </div>
        </div>
      </form>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="toolbar">
      <div class="filter-tabs" id="status-tabs">
        <button class="tab-btn active" data-status="all">전체</button>
        <button class="tab-btn" data-status="active">진행 중</button>
        <button class="tab-btn" data-status="completed">완료</button>
      </div>

      <div class="toolbar-controls">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="할 일 검색..." />
        </div>

        <select id="filter-category" class="filter-select">
          <option value="all">모든 카테고리</option>
          <option value="업무">업무</option>
          <option value="개발">개발</option>
          <option value="개인">개인</option>
          <option value="공부">공부</option>
          <option value="건강">건강</option>
          <option value="기타">기타</option>
        </select>

        <button id="btn-clear-completed" class="btn-secondary" title="완료된 항목 모두 삭제">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>완료 항목 정리</span>
        </button>
      </div>
    </section>

    <!-- Todo List Container -->
    <main class="todo-list-container">
      <div id="todo-list" class="todo-list">
        <!-- JS로 동적 렌더링 -->
      </div>
      
      <!-- Empty State Placeholder -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 12h8"></path>
          </svg>
        </div>
        <p class="empty-title">등록된 할 일이 없습니다</p>
        <p class="empty-subtitle">새로운 할 일을 추가하고 생산적인 하루를 시작해 보세요!</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Python Flask & SQLite 기반 스마트 할 일 관리 웹앱</p>
    </footer>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">할 일 편집</h2>
        <button id="modal-close" class="btn-icon" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="edit-form" class="modal-body">
        <input type="hidden" id="edit-id" />
        
        <div class="modal-field">
          <label for="edit-title">제목</label>
          <input type="text" id="edit-title" class="input-title" required />
        </div>

        <div class="modal-row">
          <div class="modal-field">
            <label for="edit-category">카테고리</label>
            <select id="edit-category" class="input-select">
              <option value="업무">💼 업무</option>
              <option value="개발">💻 개발</option>
              <option value="개인">👤 개인</option>
              <option value="공부">📚 공부</option>
              <option value="건강">🏃 건강</option>
              <option value="기타">✨ 기타</option>
            </select>
          </div>

          <div class="modal-field">
            <label for="edit-priority">우선순위</label>
            <select id="edit-priority" class="input-select">
              <option value="high">🔥 높음</option>
              <option value="medium">⚡ 보통</option>
              <option value="low">🌱 낮음</option>
            </select>
          </div>
        </div>

        <div class="modal-field">
          <label for="edit-due-date">마감일</label>
          <input type="date" id="edit-due-date" class="input-date" />
        </div>

        <div class="modal-field">
          <label for="edit-desc">상세 메모</label>
          <textarea id="edit-desc" class="input-textarea" rows="3" placeholder="메모를 입력하세요..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-edit" class="btn-secondary">취소</button>
          <button type="submit" class="btn-primary">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
