<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValueCheck - 국내 투자판단 도우미</title>
  <meta name="description" content="국내 주식 핵심 지표를 입력하면 참고용 투자판단 점수를 계산해주는 웹 애플리케이션">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-dark">
  <div class="app-background-glow"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="10"></line>
            <line x1="18" y1="20" x2="18" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="16"></line>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">ValueCheck</h1>
          <p class="brand-subtitle" id="current-date">국내 주식 투자판단 도우미</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" title="다크/라이트 테마 변경">
          <svg id="theme-icon-sun" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Section -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">총 평가 건수</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-badge blue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">매수 고려 이상</span>
          <span class="stat-value" id="stat-positive">0</span>
        </div>
        <div class="stat-badge emerald">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <span class="stat-label">주의 필요</span>
          <span class="stat-value" id="stat-caution">0</span>
        </div>
        <div class="stat-badge amber">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
      </div>

      <div class="stat-card progress-card">
        <div class="stat-info">
          <span class="stat-label">긍정 평가 비율</span>
          <span class="stat-value" id="stat-rate">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Evaluation Form -->
    <section class="card form-card">
      <form id="eval-form" class="todo-form">
        <div class="form-main-row">
          <input
            type="text"
            id="ticker-input"
            class="input-title"
            placeholder="종목명 또는 티커 (예: 삼성전자, 005930) - 선택 입력"
            autocomplete="off"
          />
          <button type="submit" class="btn-primary" id="btn-evaluate">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span>판단하기</span>
          </button>
        </div>

        <div class="form-sub-row">
          <div class="form-field">
            <label for="m-per">PER (배)</label>
            <input type="number" step="0.01" id="m-per" class="input-text" placeholder="예: 12.5" />
          </div>
          <div class="form-field">
            <label for="m-pbr">PBR (배)</label>
            <input type="number" step="0.01" id="m-pbr" class="input-text" placeholder="예: 1.2" />
          </div>
          <div class="form-field">
            <label for="m-roe">ROE (%)</label>
            <input type="number" step="0.01" id="m-roe" class="input-text" placeholder="예: 15" />
          </div>
          <div class="form-field">
            <label for="m-operating-margin">영업이익률 (%)</label>
            <input type="number" step="0.01" id="m-operating-margin" class="input-text" placeholder="예: 12" />
          </div>
          <div class="form-field">
            <label for="m-debt-ratio">부채비율 (%)</label>
            <input type="number" step="0.01" id="m-debt-ratio" class="input-text" placeholder="예: 80" />
          </div>
          <div class="form-field">
            <label for="m-revenue-growth">매출성장률 YoY (%)</label>
            <input type="number" step="0.01" id="m-revenue-growth" class="input-text" placeholder="예: 10" />
          </div>
          <div class="form-field">
            <label for="m-profit-growth">영업이익성장률 YoY (%)</label>
            <input type="number" step="0.01" id="m-profit-growth" class="input-text" placeholder="예: 20" />
          </div>
          <div class="form-field">
            <label for="m-dividend-yield">배당수익률 (%)</label>
            <input type="number" step="0.01" id="m-dividend-yield" class="input-text" placeholder="예: 2.5" />
          </div>
        </div>
      </form>

      <div class="disclaimer-banner">
        ⚠️ 이 도구는 입력하신 수치를 기준으로 한 참고용 계산기이며 투자 자문이 아닙니다. 실제 데이터 확인과 최종 투자 판단·책임은 본인에게 있습니다.
      </div>
    </section>

    <!-- Result Panel -->
    <section id="result-panel" class="card result-card" style="display: none;">
      <div class="verdict-banner">
        <div class="verdict-main">
          <span class="verdict-label" id="verdict-label">-</span>
          <span class="verdict-ticker" id="verdict-ticker"></span>
        </div>
        <div class="verdict-score" id="verdict-score">0<span class="score-unit">점</span></div>
      </div>
      <div class="score-gauge-container">
        <div class="score-gauge-fill" id="score-gauge-fill" style="width: 0%"></div>
      </div>
      <div class="breakdown-grid" id="breakdown-grid"></div>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="toolbar">
      <div class="filter-tabs" id="tier-tabs">
        <button class="tab-btn active" data-tier="all">전체</button>
        <button class="tab-btn" data-tier="positive">매수 고려</button>
        <button class="tab-btn" data-tier="caution">주의 필요</button>
      </div>

      <div class="toolbar-controls">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="종목명 검색..." />
        </div>

        <select id="sort-select" class="filter-select">
          <option value="recent">최신순</option>
          <option value="score-desc">점수 높은순</option>
          <option value="score-asc">점수 낮은순</option>
        </select>

        <button id="btn-clear-history" class="btn-secondary" title="모든 판단 기록 삭제">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>전체 기록 삭제</span>
        </button>
      </div>
    </section>

    <!-- History List Container -->
    <main class="todo-list-container">
      <div id="history-list" class="todo-list">
        <!-- JS로 동적 렌더링 -->
      </div>

      <!-- Empty State Placeholder -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="12" y1="20" x2="12" y2="10"></line>
            <line x1="18" y1="20" x2="18" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="16"></line>
          </svg>
        </div>
        <p class="empty-title">아직 판단 기록이 없습니다</p>
        <p class="empty-subtitle">지표를 입력하고 "판단하기"를 눌러 첫 평가를 시작해 보세요!</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Python Flask 기반 국내 투자판단 도우미 · 판단 기록은 이 브라우저에만 저장됩니다</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
